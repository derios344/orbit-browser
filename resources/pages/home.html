<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio</title>
<style>
  :root {
    --bg: #1d2229;
    --panel: #232a33;
    --border: #313a46;
    --text: #e6ebf2;
    --muted: #8b95a5;
    --accent: #a08cc9;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #262e38 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    width: min(560px, 88vw);
    text-align: center;
    padding-bottom: 8vh;
  }

  h1 {
    margin: 0 0 .35em;
    font-size: 3em;
    font-weight: 600;
    letter-spacing: .22em;
    text-indent: .22em;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .tagline {
    margin: 0 0 2.2em;
    color: var(--muted);
    font-size: .9em;
    letter-spacing: .04em;
  }

  form {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    transition: border-color .15s ease;
  }

  form:focus-within { border-color: var(--accent); }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1em;
    padding: 10px 12px;
  }

  input[type="search"]::placeholder { color: #6f7a8a; }

  button {
    background: #2e3742;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .9em;
    padding: 0 18px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }

  button:hover { background: #39444f; border-color: var(--accent); }
  button:active { background: #2a323c; }

  .hint {
    margin-top: 1.6em;
    color: #6f7a8a;
    font-size: .78em;
    letter-spacing: .03em;
  }

  kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: .95em;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>ORB<span>I</span>T</h1>
    <p class="tagline">Navegador experimental</p>

    <form action="https://duckduckgo.com/" method="get" role="search">
      <input type="search" name="q" placeholder="Buscar en DuckDuckGo o escribir una dirección"
             aria-label="Buscar en DuckDuckGo" autocomplete="off" autofocus required>
      <button type="submit">Buscar</button>
    </form>

    <p class="hint">Búsquedas con DuckDuckGo · <kbd>Ctrl</kbd> + <kbd>L</kbd> para la barra de direcciones</p>
  </main>
</body>
</html>
